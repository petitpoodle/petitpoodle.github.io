<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | Bampoo</title>
    <style>
        :root {
            --main-color: #5a4b41;
            --bg-color: #fcfbfa;
            --accent-color: #a38874;
            --text-color: #333333;
            --card-bg: #ffffff;
            --border-color: #e8e3df;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            padding: 20px 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }
        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 30px;
        }
        header h1 { font-size: 1.8rem; color: var(--main-color); }
        
        nav { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        nav a { color: var(--main-color); text-decoration: none; font-size: 0.9rem; font-weight: bold; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--main-color); }
        input[type="text"], input[type="email"], input[type="tel"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }
        textarea { height: 120px; }
        .submit-btn {
            background-color: var(--main-color);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover { background-color: var(--accent-color); }
        
        .sns-box {
            background: #f7f5f2;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 30px;
        }

        footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>お問い合わせ</h1>
        <nav>
            <a href="index.html">トップ</a>
            <a href="info.html">お取引の流れ</a>
            <a href="hyouki.html">特定商取引法表記</a>
            <a href="contact.html">お問い合わせ</a>
        </nav>
    </header>

    <main>
        <div class="sns-box">
            <p>InstagramのDMからのお問い合わせも受け付けております。</p>
            <p><strong>Instagram: @アカウント名</strong></p>
        </div>

        <form action="#" method="post">
            <div class="form-group">
                <label for="name">お名前 *</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="address">ご住所 *</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="tel">お電話番号 *</label>
                <input type="tel" id="tel" name="tel" required>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">お問い合わせ内容 *</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="submit-btn">送信する</button>
        </form>
    </main>

    <footer>
        <p>&copy; Bampoo All Rights Reserved.</p>
    </footer>
</div>

</body>
</html>
